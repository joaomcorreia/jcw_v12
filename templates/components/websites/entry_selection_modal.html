{% load i18n %}
<div
  class="fixed inset-0 z-[70] hidden items-center justify-center bg-slate-950/60 px-4 py-6"
  data-jcw-entry-modal
  aria-hidden="true"
>
  <div
    class="absolute inset-0"
    data-jcw-entry-modal-close
  ></div>
  <div
    class="relative z-10 w-full max-w-2xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="entry-selection-modal-title"
  >
    <div class="flex items-start justify-between gap-4 border-b border-slate-200 px-6 py-5 sm:px-8">
      <div>
        <h2 id="entry-selection-modal-title" class="text-2xl font-bold text-slate-900">
          {% trans "What do you want to start with?" %}
        </h2>
      </div>
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 text-slate-500 transition hover:bg-slate-50 hover:text-slate-700"
        data-jcw-entry-modal-close
        aria-label="{% trans 'Close' %}"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div class="grid grid-cols-1 gap-4 p-6 sm:grid-cols-2 sm:p-8">
      <button
        type="button"
        class="group rounded-2xl border border-slate-200 bg-white p-6 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-blue-300 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        data-jcw-entry-choice="simple-website"
      >
        <div class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-100 text-blue-700">
          <span class="h-2.5 w-2.5 rounded-full bg-current"></span>
        </div>
        <h3 class="mt-4 text-xl font-semibold text-slate-900">
          {% trans "Simple Website" %}
        </h3>
        <p class="mt-2 text-sm leading-6 text-slate-600">
          {% trans "Show your business online" %}
        </p>
      </button>

      <button
        type="button"
        class="group rounded-2xl border border-slate-200 bg-white p-6 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-emerald-300 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-500"
        data-jcw-entry-choice="website-with-products"
      >
        <div class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-emerald-100 text-emerald-700">
          <span class="h-2.5 w-2.5 rounded-full bg-current"></span>
        </div>
        <h3 class="mt-4 text-xl font-semibold text-slate-900">
          {% trans "Website with Products" %}
        </h3>
        <p class="mt-2 text-sm leading-6 text-slate-600">
          {% trans "Start selling online" %}
        </p>
      </button>
    </div>

    <div class="border-t border-slate-200 bg-slate-50 px-6 py-4 text-sm text-slate-600 sm:px-8">
      {% trans "Starts from €29.95/month. You can upgrade anytime." %}
    </div>
  </div>
</div>
