{% load static i18n %}
<div class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" data-jcw-main-nav{% if is_edit_mode %} style="top:56px !important;"{% endif %}>
  <div class="jcw-nav-utility transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-1">
      <div class="grid grid-cols-3 items-center text-xs sm:text-sm">
        <a class="jcw-nav-utility-link whitespace-nowrap hover:underline" href="mailto:info@justcodeworks.eu">info@justcodeworks.eu</a>
        <span class="jcw-nav-utility-meta whitespace-nowrap text-center">{% trans "The Netherlands" %}</span>
        <a class="jcw-nav-utility-link whitespace-nowrap text-right hover:underline" href="{% url 'core:contact' %}">{% trans "Contact" %}</a>
      </div>
    </div>
  </div>
  <nav data-jcw-nav class="bg-transparent border-transparent transition-all duration-300 sticky top-0 z-50"{% if is_edit_mode %} style="top:56px !important;"{% endif %}>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-20">
        <a class="flex items-center" href="{% url 'core:home' %}">
          <img src="{% static 'brand/logo-light.png' %}" alt="{% trans 'Just Code Works' %}" class="h-8 w-auto jcw-logo-light">
          <img src="{% static 'brand/logo-dark.png' %}" alt="{% trans 'Just Code Works' %}" class="h-8 w-auto jcw-logo-dark" style="display:none;">
        </a>
        <div class="hidden md:flex items-center space-x-2">
          {% for item in nav_pages %}
          <a class="jcw-main-nav-link px-3 py-2 rounded-md text-sm font-medium transition-colors duration-300 hover:opacity-80" href="{{ item.url }}">{{ item.label }}</a>
          {% endfor %}
        </div>
        <div class="flex items-center space-x-2">
          <button class="p-2 rounded-md transition-colors duration-300 md:hidden" data-jcw-mobile-toggle aria-label="{% trans 'Toggle menu' %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" d="M4 6h16M4 12h16M4 18h-16"></path></svg>
          </button>
          <div class="relative hidden sm:block">
            <form action="{% url 'set_language' %}" method="post">
              {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
              <label class="sr-only" for="language-select">{% trans "Language" %}</label>
              <select id="language-select" name="language" class="px-3 py-2 border rounded-lg bg-white/10 border-white/30 text-white uppercase" onchange="this.form.submit()">
                {% get_current_language as current_language %}{% get_available_languages as available_languages %}
                {% for code, name in available_languages %}<option value="{{ code }}"{% if code == current_language %} selected{% endif %}>{{ code }}</option>{% endfor %}
              </select>
            </form>
          </div>
        </div>
      </div>
      <div class="md:hidden" data-jcw-mobile-menu>
        <div class="pt-2 pb-3 space-y-1">
          {% for item in nav_pages %}
          <a class="jcw-main-nav-link jcw-mobile-nav-link block px-3 py-2 rounded-md text-base font-medium hover:opacity-80" href="{{ item.url }}">{{ item.label }}</a>
          {% endfor %}
        </div>
      </div>
    </div>
  </nav>
</div>
