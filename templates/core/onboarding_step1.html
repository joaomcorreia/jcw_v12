{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="ltr" class="jcw-theme-dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'jcw/all-styles.css' %}">
    <link rel="icon" href="{% static 'favicon.png' %}">
    <title>{% trans "Start designing" %}</title>
  </head>
  <body class="min-h-screen antialiased bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-50 transition-colors duration-200 font-medium">
    <div class="min-h-screen">
      <header class="border-b border-slate-200 bg-white">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
          <a class="text-xl font-bold" href="{% url 'core:home' %}">JustCodeWorks</a>
          <a class="text-sm font-semibold text-blue-700" href="{% url 'login' %}">{% trans "Login" %}</a>
        </div>
      </header>
      <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-lg p-8">
          <h1 class="text-3xl font-bold mb-2">{% trans "Tell us about your business" %}</h1>
          <p class="text-slate-600 mb-8">{% trans "We will use this to personalize your draft site." %}</p>
          {% if error %}
          <div class="mb-4 rounded-lg border border-red-200 bg-red-50 text-red-700 px-4 py-2 text-sm">{{ error }}</div>
          {% endif %}
          <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
              <label class="block text-sm font-semibold mb-2" for="business_name">{% trans "Business name" %}</label>
              <input id="business_name" name="business_name" type="text" value="{{ draft.business_name }}" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2" for="business_type">{% trans "Business type (optional)" %}</label>
              <input id="business_type" name="business_type" type="text" value="{{ draft.business_type }}" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2" for="preferred_language">{% trans "Preferred language" %}</label>
              <select id="preferred_language" name="preferred_language" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                {% for code, name in languages %}
                  <option value="{{ code }}"{% if code == draft.preferred_language %} selected{% endif %}>{{ name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="flex justify-end">
              <button type="submit" class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">{% trans "Continue" %}</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
