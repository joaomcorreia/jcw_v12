{% load i18n %}
<div class="dashboard-card dashboard-card--auto">
  <div class="dashboard-card-header">
    <h3 class="dashboard-card-title">{% trans "Quick links" %}</h3>
  </div>
  <div class="dashboard-link-list">
    {% for link in quick_links %}
    <a class="dashboard-link" href="{{ link.url }}">{{ link.label }}</a>
    {% empty %}
    <p class="dashboard-muted">{% trans "No quick links yet." %}</p>
    {% endfor %}
  </div>
</div>
