{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="ltr" class="jcw-theme-dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'jcw/all-styles.css' %}">
    <link rel="icon" href="{% static 'favicon.png' %}">
    <title>{% trans "Create account" %}</title>
  </head>
  <body class="min-h-screen antialiased bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-50 transition-colors duration-200 font-medium">
    <div class="min-h-screen">
      <main class="max-w-lg mx-auto px-4 py-16">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-lg p-8">
          <h1 class="text-2xl font-bold mb-2">{% trans "Create your account" %}</h1>
          <p class="text-slate-600 mb-6">{% trans "Create an account to save and manage your website." %}</p>
          <form method="post" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {{ form.as_p }}
            <button type="submit" class="w-full px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">{% trans "Create account" %}</button>
          </form>
          <p class="mt-6 text-sm text-slate-600">
            {% trans "Already have an account?" %}
            <a class="text-blue-700 font-semibold" href="{% url 'login' %}">{% trans "Log in" %}</a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
