<section data-jcw-section="{{ section.key }}" data-jcw-section-id="{{ section.id }}">
  {% if data.heading %}
    <h2 data-jcw-field="features.heading" data-jcw-field-id="p{{ page.id }}-s{{ section.id }}-features.heading" data-jcw-type="text">{{ data.heading }}</h2>
  {% endif %}
  {% if data.intro %}
    <p data-jcw-field="features.intro" data-jcw-field-id="p{{ page.id }}-s{{ section.id }}-features.intro" data-jcw-type="text">{{ data.intro }}</p>
  {% endif %}
  {% if data.items %}
    <div>
      {% for item in data.items %}
        <div data-jcw-section="{{ section.key }}.item.{{ forloop.counter0 }}" data-jcw-section-id="{{ section.id }}">
          {% if item.title %}
            <h3 data-jcw-field="features.items.{{ forloop.counter0 }}.title" data-jcw-field-id="p{{ page.id }}-s{{ section.id }}-features.items.{{ forloop.counter0 }}.title" data-jcw-type="text">{{ item.title }}</h3>
          {% endif %}
          {% if item.body %}
            <p data-jcw-field="features.items.{{ forloop.counter0 }}.body" data-jcw-field-id="p{{ page.id }}-s{{ section.id }}-features.items.{{ forloop.counter0 }}.body" data-jcw-type="text">{{ item.body }}</p>
          {% endif %}
        </div>
      {% endfor %}
    </div>
  {% endif %}
</section>
